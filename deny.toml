[graph]
all-features = true

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode via syntect only decodes the syntax dumps embedded in the binary, never input" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained with no fixed release; usvg, fontdb, mermaid-rs-renderer and mrk's glyph check parse fonts with it, and no maintained parser replaces it under usvg. It parses the font files in the font directories and mermaid-rs-renderer's font copy under $XDG_CACHE_HOME/mmdr, which any program of the user can write (specs/02-security.md rule 3)" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
