[package]
name = "mrk"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Render Markdown beautifully in the terminal: syntax highlighting, tables, themes, and Mermaid diagrams as images."
license = "MIT"
readme = "README.md"
repository = "https://github.com/vmeyet/mrk-cli"
homepage = "https://github.com/vmeyet/mrk-cli"
keywords = ["markdown", "terminal", "mermaid", "cli", "renderer"]
categories = ["command-line-utilities", "text-processing", "visualization"]
include = ["/src/**/*.rs", "/build.rs", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "mrk"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:base64", "dep:clap", "dep:clap_complete", "dep:crossterm", "dep:dirs", "dep:rustix", "dep:serde", "dep:shell-words", "dep:toml"]

[dependencies]
anyhow = "1.0"
base64 = { version = "0.22", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
clap_complete = { version = "4.5", optional = true }
comrak = { version = "0.55", default-features = false }
crossterm = { version = "0.29", features = ["use-dev-tty"], optional = true }
dirs = { version = "7.0", optional = true }
mermaid-rs-renderer = { version = "0.3", default-features = false }
mermaid-text = "0.57"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
shell-words = { version = "1.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
toml = { version = "1.1", optional = true }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"], optional = true }

[dev-dependencies]
base64 = "0.22"
tempfile = "3.20"
assert_cmd = "2.0"
insta = "1"
predicates = "3.1"

[profile.release]
opt-level = "s"
lto = "fat"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
format_collect = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
