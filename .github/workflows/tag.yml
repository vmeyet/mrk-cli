name: Tag
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
permissions: {}
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The deploy key stays persisted: the tag push below authenticates with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_TAGGER_KEY }}
          fetch-tags: true
      - run: |
          tag="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          git rev-parse -q --verify "refs/tags/$tag" && exit 0
          git tag "$tag" && git push origin "$tag"
